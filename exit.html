<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --teal:#4c8c8c; --teal-d:#356a6a; --aqua:#a0e7e5; --cream:#fff4e6; --peach:#ffe6cc;
    --ink:#24343a; --muted:#5d6f73; --line:#ead9c2; --bg:#fbf8f3; --ok:#3f9a6b; --star:#c98a12;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:var(--teal-d)}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 32px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 0}
  .btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;padding:10px 18px;border-radius:99px;white-space:nowrap;border:0;font:inherit;font-weight:800;cursor:pointer}
  .btn:hover{background:var(--teal-d)}
  .btn.light{background:#fff;color:var(--teal-d);border:2px solid var(--teal)}
  .title{font-weight:800;color:var(--teal-d);font-size:1.1em}
  .card{background:var(--cream);border:3px solid var(--teal);border-radius:14px;padding:16px}
  .q{position:sticky;top:0;z-index:2;margin-top:14px;box-shadow:0 6px 14px rgba(53,106,106,.15)}
  .q .lbl{font-size:.85em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
  .q .date{font-weight:700;color:var(--muted);font-size:.9em;margin:0}
  .q .text{font-size:1.45em;font-weight:800;margin:6px 0 0;line-height:1.3}
  .form{margin-top:16px;background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden}
  .form iframe{display:block;width:100%;height:1100px;border:0}
  .help{text-align:center;color:var(--muted);font-size:.9em;margin:12px 0 0}
  .err{background:#fff;border:2px dashed #d66;border-radius:10px;padding:14px;margin-top:16px}
  @media (max-width:600px){ .q .text{font-size:1.2em} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="bar">
    <a class="btn light" id="back" href="index.html">← Back to class</a>
    <span class="title" id="title">🎟️ Exit Ticket</span>
  </div>
</div>
<script>
/* Exit ticket page: shows the question of the day, with the class's Google Form embedded below it.
   Opened from a class page's Exit ticket button: exit.html?c=physics.html&q=<question>
   The form comes from that class page's CHECKIN_FORM setting (or &f= when a day has its own ET Link). */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=html=>{ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const isForm=u=>/^https:\/\/docs\.google\.com\/forms\//.test(u||'');
function embedUrl(u){
  const base=u.split(/[?#]/)[0].replace(/\/(viewform|edit|formResponse)$/,'');
  return base+'/viewform?embedded=true';
}

async function main(){
  const p=new URLSearchParams(location.search);
  const page=/^[\w-]+\.html$/.test(p.get('c')||'') ? p.get('c') : '';
  const q=(p.get('q')||'').trim();
  const app=document.getElementById('app');
  const dayP=/^\d{4}-\d{2}-\d{2}$/.test(p.get('d')||'') ? p.get('d') : '';
  if(page) document.getElementById('back').href=page+(dayP?'?day='+dayP:'');

  let form=p.get('f')||'', title='';
  if(page){
    try{
      const html=await (await fetch(page,{cache:'no-store'})).text();
      title=(html.match(/TITLE:\s*'([^']*)'/)||[])[1]||'';
      const cf=(html.match(/CHECKIN_FORM:\s*'([^']*)'/)||[])[1]||'';
      if(cf) form=cf;
    }catch(e){ console.warn('Could not read', page, e); }
  }
  if(title){ document.getElementById('title').textContent='🎟️ '+title+' · Exit Ticket'; document.title='Exit Ticket · '+title; }

  const dd=/^\d{4}-\d{2}-\d{2}$/.test(p.get('d')||'') ? new Date(p.get('d')+'T12:00') : new Date();   // &d= the day the question is from
  const today=dd.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  app.append(el(`<section class="card q" aria-label="Question of the day">
    <p class="lbl">${dd.toDateString()!==new Date().toDateString()?'Exit ticket question':'Today\'s exit ticket question'}</p>
    <p class="date">${esc(today)}</p>
    <p class="text">${q?esc(q):'Check the board for today\'s question.'}</p>
  </section>`));

  if(isForm(form)){
    app.append(el(`<div class="form"><iframe src="${esc(embedUrl(form))}" title="Exit ticket form" loading="eager">Loading…</iframe></div>`));
    app.append(el(`<p class="help">Form not showing up? <a class="btn light" style="margin-left:6px" href="${esc(form)}" target="_blank" rel="noopener">Open the form in a new tab</a></p>`));
  } else if(/^https?:\/\//.test(form)){
    app.append(el(`<p class="help"><a class="btn" href="${esc(form)}" target="_blank" rel="noopener">Open the exit ticket</a></p>`));
  } else {
    app.append(el(`<div class="err"><b>The exit ticket form isn't linked yet.</b> Ask Mrs. Dunlea.</div>`));
  }
}
main();
</script>
</body>
</html>
