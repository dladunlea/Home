<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --teal:#4c8c8c; --teal-d:#356a6a; --aqua:#a0e7e5; --cream:#fff4e6; --peach:#ffe6cc;
    --ink:#24343a; --muted:#5d6f73; --line:#ead9c2; --bg:#fbf8f3; --ok:#3f9a6b; --star:#c98a12;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:var(--teal-d)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px 24px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 0}
  .btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;padding:10px 18px;border-radius:99px;white-space:nowrap;border:0;font:inherit;font-weight:800;cursor:pointer}
  .btn:hover{background:var(--teal-d)}
  .btn.light{background:#fff;color:var(--teal-d);border:2px solid var(--teal)}
  .title{font-weight:800;color:var(--teal-d);font-size:1.1em}
  .card{background:var(--cream);border:3px solid var(--teal);border-radius:14px;padding:12px 16px;margin-top:14px}
  .card .lbl{font-size:.85em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
  .card .name{font-size:1.35em;font-weight:800;margin:2px 0 0;line-height:1.3}
  /* 16:9 player that fits an iPad in landscape without scrolling */
  .player{margin:14px auto 0;width:min(100%, calc((100vh - 230px) * 16 / 9));min-width:280px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 6px 14px rgba(53,106,106,.18)}
  .player iframe{display:block;width:100%;height:100%;border:0}
  .help{text-align:center;color:var(--muted);font-size:.9em;margin:12px 0 0}
  .err{background:#fff;border:2px dashed #d66;border-radius:10px;padding:14px;margin-top:16px}
  @media (max-width:600px){ .card .name{font-size:1.15em} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="bar">
    <a class="btn light" id="back" href="index.html">← Back to class</a>
    <span class="title" id="title">🎬 Video</span>
  </div>
</div>
<script>
/* Video page: plays a video inside the class site instead of sending students to YouTube.
   Opened from a class page's Watch button. Two kinds of links:
     One video:   video.html?c=math3.html&v=<YouTube video id>&t=<video name>&d=<day>
     A playlist:  video.html?c=advisory.html&l=<YouTube playlist id>&t=<name>&d=<day>
   A playlist plays from its first item. A channel's uploads list (the channel ID with UU in
   place of UC) is kept newest-first by YouTube, so it always opens on the latest video,
   e.g. DLA TV: l=UUlrk8BLy-fnhz_g2xGnmH1A
   Uses YouTube's privacy-enhanced player (youtube-nocookie.com). */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=html=>{ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };

async function main(){
  const p=new URLSearchParams(location.search);
  const page=/^[\w-]+\.html$/.test(p.get('c')||'') ? p.get('c') : '';
  const day=/^\d{4}-\d{2}-\d{2}$/.test(p.get('d')||'') ? p.get('d') : '';
  const id=/^[\w-]{11}$/.test(p.get('v')||'') ? p.get('v') : '';
  const list=/^[A-Za-z]{2}[\w-]{10,64}$/.test(p.get('l')||'') ? p.get('l') : '';
  const name=(p.get('t')||'').trim();
  const app=document.getElementById('app');
  if(page) document.getElementById('back').href=page+(day?'?day='+day:'');

  let title='';
  if(page){
    try{ const html=await (await fetch(page,{cache:'no-store'})).text(); title=(html.match(/TITLE:\s*'([^']*)'/)||[])[1]||''; }
    catch(e){ console.warn('Could not read', page, e); }
  }
  if(title) document.getElementById('title').textContent='🎬 '+title+' · Video';
  document.title=(name||'Video')+(title?' · '+title:'');

  if(!id && !list){
    app.append(el(`<div class="err"><b>This video link isn't working.</b> Go back and try the Watch button again, or ask Mrs. Dunlea.</div>`));
    return;
  }
  const opts='rel=0&modestbranding=1&playsinline=1';
  const src = id
    ? `https://www.youtube-nocookie.com/embed/${id}?${opts}`
    : `https://www.youtube-nocookie.com/embed/videoseries?list=${list}&${opts}`;
  const open = id
    ? `https://www.youtube.com/watch?v=${id}`
    : `https://www.youtube.com/playlist?list=${list}`;
  const label = name || (id ? 'Lesson video' : 'Latest video');

  app.append(el(`<section class="card" aria-label="Video"><p class="lbl">Watch</p><p class="name">${esc(label)}</p></section>`));
  app.append(el(`<div class="player"><iframe src="${src}"
    title="${esc(label)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="eager"></iframe></div>`));
  app.append(el(`<p class="help">Video not playing? <a class="btn light" style="margin-left:6px" href="${open}" target="_blank" rel="noopener">Open it on YouTube</a></p>`));
}
main();
</script>
</body>
</html>
