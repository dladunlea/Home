<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #ff6b6b;
        }
        .question {
            font-size: 36px;
            text-align: center;
            margin: 30px 0;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        button {
            width: 100%;
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ee5a52;
        }
        .feedback {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 30px;
        }
        .correct { color: #2ecc71; }
        .incorrect { color: #e74c3c; }
        .score {
            text-align: center;
            font-size: 20px;
            color: #7f8c8d;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="../webapps.html" class="back-link">← Back to Apps</a>
    
    <div class="container">
        <h1>🧮 Math Practice</h1>
        
        <div class="score">
            Score: <span id="correct">0</span> / <span id="total">0</span>
        </div>
        
        <div class="question" id="question">5 + 3 = ?</div>
        
        <input type="number" id="answer" placeholder="Your answer" onkeypress="if(event.key==='Enter') checkAnswer()">
        
        <button onclick="checkAnswer()">Submit Answer</button>
        
        <div class="feedback" id="feedback"></div>
    </div>

    <script>
        let num1, num2, correctAnswer;
        let correctCount = 0;
        let totalCount = 0;

        function generateQuestion() {
            num1 = Math.floor(Math.random() * 20) + 1;
            num2 = Math.floor(Math.random() * 20) + 1;
            correctAnswer = num1 + num2;
            
            document.getElementById('question').textContent = `${num1} + ${num2} = ?`;
            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answer').value);
            const feedback = document.getElementById('feedback');
            
            if (isNaN(userAnswer)) {
                feedback.textContent = 'Please enter a number!';
                feedback.className = 'feedback';
                return;
            }
            
            totalCount++;
            
            if (userAnswer === correctAnswer) {
                correctCount++;
                feedback.textContent = '✓ Correct! Great job!';
                feedback.className = 'feedback correct';
            } else {
                feedback.textContent = `✗ Not quite. The answer is ${correctAnswer}`;
                feedback.className = 'feedback incorrect';
            }
            
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('total').textContent = totalCount;
            
            setTimeout(generateQuestion, 2000);
        }

        // Start with first question
        generateQuestion();
    </script>
</body>
</html>
