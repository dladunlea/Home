<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-top: 0;
        }
        .timer-display {
            font-size: 80px;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        input {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 100px;
            text-align: center;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5568d3;
        }
        .presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .preset-btn {
            background-color: #f0f0f0;
            color: #333;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .preset-btn:hover {
            background-color: #e0e0e0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .status {
            text-align: center;
            font-size: 20px;
            color: #666;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="teacher-hub.html" class="back-link">← Back to Hub</a>
        
        <h1>⏱️ Timer Control</h1>
        
        <div class="status" id="status">Ready</div>
        <div class="timer-display" id="display">05:00</div>
        
        <div class="presets">
            <button class="preset-btn" onclick="setPreset(1)">1 min</button>
            <button class="preset-btn" onclick="setPreset(5)">5 min</button>
            <button class="preset-btn" onclick="setPreset(10)">10 min</button>
            <button class="preset-btn" onclick="setPreset(15)">15 min</button>
            <button class="preset-btn" onclick="setPreset(20)">20 min</button>
            <button class="preset-btn" onclick="setPreset(30)">30 min</button>
        </div>
        
        <div class="controls">
            <label>Custom:</label>
            <input type="number" id="minutes" min="0" max="99" value="5">
            <input type="number" id="seconds" min="0" max="59" value="0">
        </div>
        
        <div class="controls">
            <button onclick="startTimer()">▶️ Start</button>
            <button onclick="pauseTimer()">⏸️ Pause</button>
            <button onclick="resetTimer()">🔄 Reset</button>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let isRunning = false;

        function updateDisplay() {
            const timerData = localStorage.getItem('teacherTimer');
            if (timerData) {
                const data = JSON.parse(timerData);
                const now = Date.now();
                const timeLeft = Math.max(0, data.endTime - now);
                
                const mins = Math.floor(timeLeft / 60000);
                const secs = Math.floor((timeLeft % 60000) / 1000);
                document.getElementById('display').textContent = 
                    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                
                if (timeLeft === 0 && isRunning) {
                    pauseTimer();
                    document.getElementById('status').textContent = "Time's Up!";
                }
            }
        }

        function setPreset(minutes) {
            document.getElementById('minutes').value = minutes;
            document.getElementById('seconds').value = 0;
            updateDisplayFromInputs();
        }

        function updateDisplayFromInputs() {
            const mins = parseInt(document.getElementById('minutes').value) || 0;
            const secs = parseInt(document.getElementById('seconds').value) || 0;
            document.getElementById('display').textContent = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function startTimer() {
            const mins = parseInt(document.getElementById('minutes').value) || 0;
            const secs = parseInt(document.getElementById('seconds').value) || 0;
            const totalMs = (mins * 60 + secs) * 1000;
            
            const endTime = Date.now() + totalMs;
            localStorage.setItem('teacherTimer', JSON.stringify({ endTime }));
            
            isRunning = true;
            document.getElementById('status').textContent = 'Timer Running...';
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateDisplay, 1000);
            updateDisplay();
        }

        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isRunning = false;
            localStorage.removeItem('teacherTimer');
            document.getElementById('status').textContent = 'Paused';
        }

        function resetTimer() {
            pauseTimer();
            updateDisplayFromInputs();
            document.getElementById('status').textContent = 'Ready';
        }

        // Initialize
        document.getElementById('minutes').addEventListener('input', updateDisplayFromInputs);
        document.getElementById('seconds').addEventListener('input', updateDisplayFromInputs);
        updateDisplay();
    </script>
</body>
</html>
